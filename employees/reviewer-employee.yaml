id: reviewer-employee
name: 评审员工
runtime: agentteams
model: default
prompt: prompts/reviewer.md
procedures:
- code-critique
crafts:
- rule-compliance
tools:
  allow:
  - Read
  - Grep
  - Glob
  deny:
  - WebFetch
  - WebSearch
permissions:
  write_paths:
  - tasks/{task_id}/**
  forbid_paths:
  - repos/**
  - genome/**
assignee: ''
