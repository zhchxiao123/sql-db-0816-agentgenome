id: arch-employee
name: 架构员工
runtime: agentteams
model: default
prompt: prompts/arch.md
procedures:
- experience-distill
tools:
  allow:
  - Read
  - Grep
  - Glob
  - Write
  - Edit
  - Bash
  deny:
  - WebFetch
  - WebSearch
permissions:
  write_paths:
  - genome/**
  - tasks/{task_id}/**
  forbid_paths:
  - repos/**
assignee: ''
