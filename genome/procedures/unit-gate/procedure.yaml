id: unit-gate
version: 1.0.0
summary: 跑涉及模块的门禁,产出结构化报告
kind: deterministic
trigger:
  states:
  - UNIT_TESTING
  - DEVELOPING
inputs:
  schema:
    type: object
    properties:
      task_id:
        type: string
      modules:
        type: array
        items:
          type: string
outputs:
  artifacts:
  - gate-report.json
  schema_ref: schemas/out.json
compat:
  runtimes:
  - none
  - agentteams
