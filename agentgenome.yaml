runtime:
  default: claude-code
  runtimes:
    claude-code:
      cmd: claude
      max_turns: 100000000
      endpoint: null
      consumer_token_env: null
      transport: http
      matrix_homeserver: null
      matrix_room: null
      matrix_token_env: null
      storage_prefix: null
      worker: null
      mc_cmd: mc
      agentteams_max_job_runtime_s: 3600
      model_tiers: {}
    agentteams:
      cmd: null
      max_turns: 4000
      endpoint: http://192.168.107.2:8090
      consumer_token_env: AGENTTEAMS_CONSUMER_TOKEN
      transport: matrix-minio
      matrix_homeserver: http://192.168.107.2:8080
      matrix_room: null
      matrix_token_env: AGENTTEAMS_MATRIX_TOKEN
      storage_prefix: agentteams/agentteams-storage/shared
      worker: null
      mc_cmd: mc
      agentteams_max_job_runtime_s: 3600
      model_tiers: {}
  default_is_explicit: true
concurrency:
  global_jobs: 3
topology:
  default: single
  critique:
    enabled: false
    on_protected: true
    min_modules: 2
    min_changed_files: 5
    max_rounds: 100000000
    budget_share: 0.3
  assisted:
    employees:
    - itest-employee
    confirmer: ''
  best_of_n:
    attempts:
    - key: minimal
      hint: 最小改动:能不动的地方都别动
    - key: perf
      hint: 性能优先:热路径上的开销要说得出数量级
    - key: contract
      hint: 契约先行:先把接口与数据形状定清楚再写实现
    judge_employee: reviewer-employee
    judge_procedure: code-critique
    max_attempts: 100000000
budgets:
  enforce: false
  per_task_tokens: 100000000
  per_job_tokens: 100000000
  session_tokens: 100000000
limits:
  max_fix_rounds: 100000000
  job_timeout_s: 100000000
itest:
  timeout_s: 100000000
genome_tasks:
  per_task_tokens: 100000000
knowledge:
  root_index_lines: 150
  module_map_lines: 200
  card_lines: 300
  fragmentation_threshold: 3
evidence:
  archive_dir: archive
  log_retention_days: 30
approval:
  approvers: []
platform:
  git_host: github
  protected_branch: main
umodel:
  enabled: false
